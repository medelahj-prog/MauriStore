    const inv = invData.find(i => i.id == id);

      const pName = (P.find(p=>p.id==i.product_id)||{}).name || 'منتج #'+i.product_id;

      total += itemTotal;
      html += `<tr><td>${esc(pName)}</td><td>${i.qty}</td><td>${f(i.price)}</td><td>${f(itemTotal)}</td></tr>`;

function applyCount(){const items=Object.entries(CNT).filter(([k,x])=>x!==''&&x!=null).map(([k,x])=>({product_id:+k,qty:+x}));if(!items.length)return toast('أدخل كميات الجرد أولًا');
 run(async()=>{const d=await api('/stock/count','POST',{items,note:v('cn'),branch_id:br});CNT={};toast('تم تعديل '+d.changed+' صنف')})}
function doTransfer(){run(()=>api('/stock/transfer','POST',{from_branch:br,to_branch:+v('tb'),items:[{product_id:+v('tp'),qty:+v('tq')}],note:v('tn')}),'تم النقل')}
V.stk=async()=>{P=await api('/products?branch='+br);const mv=await api('/stock/moves?limit=30&branch='+br),KL={count:'جرد',transfer_out:'نقل (صادر)',transfer_in:'نقل (وارد)'},others=BR.filter(b=>b.id!=br),bn=BR.find(b=>b.id==br)||{name:''};
 return`<div class="card"><h3>جرد المخزون — ${esc(bn.name)}</h3><p style="color:var(--mu)">أدخل الكمية الفعلية الموجودة. اترك الخانة فارغة لعدم التغيير.</p><div class="row"><label>ملاحظة<input id="cn"></label><button class="pr" onclick="applyCount()">اعتماد الجرد</button></div><input placeholder="🔍 بحث" oninput="q=this.value;$('#ct').innerHTML=ctl()" style="margin:8px 0"><div id="ct">${ctl()}</div></div>`+
 (others.length?`<div class="card"><h3>نقل بضاعة إلى فرع آخر</h3><div class="row"><label>إلى فرع<select id="tb">${others.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>المنتج<select id="tp">${P.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.qty})</option>`).join('')}</select></label><label>الكمية<input id="tq" type="number" min="1"></label><label>ملاحظة<input id="tn"></label><button class="pr" onclick="doTransfer()">نقل</button></div></div>`:'')+
 `<div class="card"><h3>سجل الحركات</h3>${tbl(['التاريخ','المنتج','النوع','التغيير','بعد','ملاحظة'],mv.map(m=>[m.at.slice(0,16),esc(m.product),KL[m.kind],m.delta,m.after,esc(m.note)]))}</div>`};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(tok)boot();else R();

</script></body></html>
